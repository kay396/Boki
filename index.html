<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복이 - 맞춤형 복지 도우미</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: #ffffff;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .pulse-anim { animation: pulse-soft 2s infinite ease-in-out; }
  </style>
</head>
<body>
  <div id="root" class="app-container"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 강아지 캐릭터 아바타
    const BokiAvatar = ({ className = "w-12 h-12" }) => (
      <div className={`bg-emerald-100 rounded-full flex items-center justify-center border-2 border-emerald-500 overflow-hidden shadow-sm flex-shrink-0 ${className}`}>
        <svg viewBox="0 0 100 100" className="w-full h-full p-1">
          <path d="M 25 35 C 10 35, 10 65, 25 60 Z" fill="#059669" stroke="#047857" strokeWidth="3" strokeLinejoin="round"/>
          <path d="M 75 35 C 90 35, 90 65, 75 60 Z" fill="#059669" stroke="#047857" strokeWidth="3" strokeLinejoin="round"/>
          <ellipse cx="50" cy="55" rx="32" ry="26" fill="#FFFFFF" stroke="#0f172a" strokeWidth="3"/>
          <circle cx="38" cy="45" r="4" fill="#0f172a"/>
          <circle cx="62" cy="45" r="4" fill="#0f172a"/>
          <ellipse cx="50" cy="52" rx="5" ry="4" fill="#0f172a"/>
          <path d="M 45 58 Q 50 63 55 58" fill="none" stroke="#0f172a" strokeWidth="3.5" strokeLinecap="round"/>
        </svg>
      </div>
    );

    // 공통 헤더
    const Header = ({ title, userProfile }) => (
      <div className="flex items-center justify-between px-5 py-4 bg-white border-b border-slate-100 sticky top-0 z-10 shadow-sm">
        <div className="flex items-center gap-2.5">
          <BokiAvatar className="w-9 h-9" />
          <span className="text-xl font-extrabold text-emerald-700 tracking-tight">복이</span>
        </div>
        <h1 className="text-lg font-bold text-slate-800">{title}</h1>
        <div className="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-600 font-bold text-sm">
          {userProfile?.name ? userProfile.name[0] : '어'}
        </div>
      </div>
    );

    // 하단 네비게이션
    const BottomNav = ({ activeTab, setActiveTab }) => {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [activeTab]);
      return (
        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] bg-white border-t border-slate-200 flex justify-around py-2.5 px-2 z-20 shadow-lg">
          <button onClick={() => setActiveTab('browse')} className={`flex flex-col items-center gap-1 px-4 py-1 rounded-xl transition-all ${activeTab === 'browse' ? 'text-emerald-600 font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
            <i data-lucide="compass" className="w-6 h-6"></i>
            <span className="text-xs">맞춤 혜택</span>
          </button>
          <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-1 px-4 py-1 rounded-xl transition-all ${activeTab === 'chat' ? 'text-emerald-600 font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
            <i data-lucide="message-square" className="w-6 h-6"></i>
            <span className="text-xs">대화하기</span>
          </button>
          <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center gap-1 px-4 py-1 rounded-xl transition-all ${activeTab === 'profile' ? 'text-emerald-600 font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
            <i data-lucide="user" className="w-6 h-6"></i>
            <span className="text-xs">내 정보</span>
          </button>
        </div>
      );
    };

    // 스플래시 및 로그인 화면
    const SplashScreen = ({ onLoginSuccess }) => {
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginId, setLoginId] = useState('');
      const [loginPw, setLoginPw] = useState('');

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [showLoginModal]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (!loginId.trim()) {
          alert('아이디 또는 이름/전화번호를 입력해주세요.');
          return;
        }
        onLoginSuccess(loginId);
      };

      return (
        <div className="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-emerald-50 via-white to-slate-50 relative">
          <div className="flex-1 flex flex-col items-center justify-center text-center mt-8">
            <div className="relative mb-8 pulse-anim">
              <div className="w-40 h-40 bg-emerald-100 rounded-full flex items-center justify-center border-4 border-emerald-500 shadow-xl p-2">
                <BokiAvatar className="w-32 h-32 border-none bg-transparent" />
              </div>
            </div>
            <span className="bg-emerald-100 text-emerald-800 text-sm font-bold px-3 py-1 rounded-full mb-3">AI 복지 도우미</span>
            <h1 className="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight">
              복이와 함께 찾아보는<br/><span className="text-emerald-600">어르신 맞춤 복지 혜택</span>
            </h1>
            <p className="text-slate-600 text-base leading-relaxed max-w-xs">
              복잡한 신청 과정도 쉽고 편하게!<br/>궁금하신 점은 언제든 복이에게 말씀해 주세요.
            </p>
          </div>

          <div className="w-full space-y-3 mb-6">
            <button 
              onClick={() => onLoginSuccess('김복순')} 
              className="w-full py-4 bg-emerald-600 text-white rounded-2xl text-lg font-bold shadow-lg hover:bg-emerald-700 transition-all flex items-center justify-center gap-2"
            >
              새로 시작하기 <i data-lucide="arrow-right" className="w-5 h-5"></i>
            </button>
            <button 
              onClick={() => setShowLoginModal(true)} 
              className="w-full py-3.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-2xl text-base font-bold hover:bg-slate-200 transition-all"
            >
              로그인하기
            </button>
          </div>

          {/* 로그인 모달 */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in zoom-in duration-200">
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-extrabold text-slate-900">로그인</h3>
                  <button onClick={() => setShowLoginModal(false)} className="p-1 rounded-full text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">성함 또는 아이디</label>
                    <input 
                      type="text" 
                      required
                      placeholder="예: 홍길동"
                      value={loginId}
                      onChange={(e) => setLoginId(e.target.value)}
                      className="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-base"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">비밀번호</label>
                    <input 
                      type="password" 
                      placeholder="비밀번호를 입력하세요"
                      value={loginPw}
                      onChange={(e) => setLoginPw(e.target.value)}
                      className="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-base"
                    />
                  </div>
                  <button type="submit" className="w-full py-4 bg-emerald-600 text-white rounded-xl text-lg font-bold shadow-md hover:bg-emerald-700 transition-all mt-2">
                    로그인 완료
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 프로필 화면
    const ProfileScreen = ({ userProfile, setUserProfile, onSave }) => {
      const speak = (text) => {
        if (userProfile.voiceSupport && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          window.speechSynthesis.speak(utterance);
        }
      };

      return (
        <div className="flex-1 flex flex-col pb-24 bg-slate-50">
          <Header title="내 정보 설정" userProfile={userProfile} />
          <div className="p-5 space-y-6 overflow-y-auto">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
              <BokiAvatar className="w-16 h-16" />
              <div>
                <h3 className="font-bold text-slate-900 text-lg">복이 도우미</h3>
                <p className="text-sm text-slate-600 leading-relaxed mt-0.5">
                  어르신께 꼭 맞는 복지 혜택을 찾아드리기 위해 기본 정보를 확인하고 있어요.
                </p>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div>
                <label className="block text-slate-700 font-bold mb-1.5 text-base">성함</label>
                <input 
                  type="text" 
                  value={userProfile.name} 
                  onChange={(e) => setUserProfile({ ...userProfile, name: e.target.value })} 
                  className="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-700 font-bold mb-1.5 text-base">성별</label>
                  <div className="flex gap-2 bg-slate-100 p-1 rounded-xl">
                    <button 
                      type="button"
                      onClick={() => setUserProfile({ ...userProfile, gender: '남성' })} 
                      className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${userProfile.gender === '남성' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}`}
                    >남성</button>
                    <button 
                      type="button"
                      onClick={() => setUserProfile({ ...userProfile, gender: '여성' })} 
                      className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${userProfile.gender === '여성' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}`}
                    >여성</button>
                  </div>
                </div>

                <div>
                  <label className="block text-slate-700 font-bold mb-1.5 text-base">연령 (만 나이)</label>
                  <input 
                    type="number" 
                    value={userProfile.age} 
                    onChange={(e) => setUserProfile({ ...userProfile, age: e.target.value })} 
                    className="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-700 font-bold mb-1.5 text-base">거주 지역</label>
                <select 
                  value={userProfile.region} 
                  onChange={(e) => setUserProfile({ ...userProfile, region: e.target.value })}
                  className="w-full p-3.5 border border-slate-300 rounded-xl text-base bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                >
                  <option value="서울특별시">서울특별시</option>
                  <option value="경기도">경기도</option>
                  <option value="부산광역시">부산광역시</option>
                  <option value="대구광역시">대구광역시</option>
                  <option value="인천광역시">인천광역시</option>
                  <option value="광주광역시">광주광역시</option>
                  <option value="대전광역시">대전광역시</option>
                  <option value="울산광역시">울산광역시</option>
                  <option value="강원특별자치도">강원특별자치도</option>
                  <option value="충청북도">충청북도</option>
                  <option value="충청남도">충청남도</option>
                  <option value="전라북도">전북특별자치도</option>
                  <option value="전라남도">전라남도</option>
                  <option value="경상북도">경상북도</option>
                  <option value="경상남도">경상남도</option>
                  <option value="제주특별자치도">제주특별자치도</option>
                </select>
              </div>

              <div>
                <label className="block text-slate-700 font-bold mb-1.5 text-base">거동 시 불편함 또는 장애 여부</label>
                <div className="flex gap-2 bg-slate-100 p-1 rounded-xl">
                  <button 
                    type="button"
                    onClick={() => setUserProfile({ ...userProfile, disabled: false })} 
                    className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${!userProfile.disabled ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}`}
                  >없음</button>
                  <button 
                    type="button"
                    onClick={() => setUserProfile({ ...userProfile, disabled: true })} 
                    className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${userProfile.disabled ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}`}
                  >있음</button>
                </div>
              </div>

              <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                <div>
                  <p className="font-bold text-slate-800 text-base">음성 읽어주기 기능</p>
                  <p className="text-xs text-slate-500">대화 및 주요 안내를 음성으로 읽어드립니다.</p>
                </div>
                <button 
                  type="button"
                  onClick={() => {
                    const nextVal = !userProfile.voiceSupport;
                    setUserProfile({ ...userProfile, voiceSupport: nextVal });
                    if (nextVal) speak("음성 읽어주기 기능이 활성화되었습니다.");
                  }}
                  className={`w-14 h-8 rounded-full p-1 transition-colors ${userProfile.voiceSupport ? 'bg-emerald-600' : 'bg-slate-300'}`}
                >
                  <div className={`w-6 h-6 bg-white rounded-full transition-transform ${userProfile.voiceSupport ? 'translate-x-6' : 'translate-x-0'}`}></div>
                </button>
              </div>
            </div>

            <button 
              onClick={() => { speak("정보가 저장되었습니다. 맞춤 혜택을 불러옵니다."); onSave(); }} 
              className="w-full py-4 bg-emerald-600 text-white rounded-2xl text-lg font-bold shadow-md hover:bg-emerald-700 transition-all flex items-center justify-center gap-2"
            >
              정보 저장하고 맞춤 혜택 보기 <i data-lucide="check" className="w-5 h-5"></i>
            </button>
          </div>
        </div>
      );
    };

    // 맞춤 혜택 찾아보기 화면
    const BrowseScreen = ({ userProfile, onOpenChat }) => {
      const [policies, setPolicies] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedPolicy, setSelectedPolicy] = useState(null);

      useEffect(() => {
        fetchRecommendedPolicies();
      }, [userProfile]);

      const fetchRecommendedPolicies = async () => {
        setLoading(true);
        try {
          const prompt = `사용자 프로필: 이름 ${userProfile.name}, 나이 ${userProfile.age}세, 성별 ${userProfile.gender}, 지역 ${userProfile.region}, 거동불편/장애 여부 ${userProfile.disabled ? '예' : '아니오'}.
          이 어르신에게 적합한 한국의 맞춤형 복지 정책 4개를 추천해줘. JSON 배열로만 응답해.
          [
            {
              "id": 1,
              "tag": "추천 혜택",
              "title": "기초연금 지급 사업",
              "shortDesc": "매월 안정적인 생활비를 지원받으실 수 있습니다.",
              "org": "보건복지부",
              "eligibility": "만 65세 이상 및 소득인정액 하위 70%",
              "period": "상시 신청"
            }
          ]`;

          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });
          const data = await res.json();
          let jsonText = data.text.trim();
          if (jsonText.startsWith('```json')) {
            jsonText = jsonText.replace(/^```json/, '').replace(/```$/, '').trim();
          } else if (jsonText.startsWith('```')) {
            jsonText = jsonText.replace(/^```/, '').replace(/```$/, '').trim();
          }
          const parsed = JSON.parse(jsonText);
          setPolicies(parsed);
        } catch (e) {
          setPolicies([
            { id: 1, tag: "인기 혜택", title: "기초연금 지급 안내", shortDesc: "매월 최대 33만 4천원의 생활보조금을 지원합니다.", org: "보건복지부 / 주민센터", eligibility: "만 65세 이상 어르신", period: "상시 신청" },
            { id: 2, tag: "건강 지원", title: "노인 무료 인공관절 수술비 지원", shortDesc: "수술비 본인 부담금 중 최대 120만원까지 지급합니다.", org: "관할 보건소", eligibility: "만 60세 이상 저소득층", period: "예산 소진 시까지" },
            { id: 3, tag: "생활 지원", title: "어르신 맞춤형 보행보조기 지원", shortDesc: "안전한 외출을 위한 보행보조기 구입비를 지원합니다.", org: "지자체 복지과", eligibility: "거동이 불편하신 어르신", period: "상시 접수" },
            { id: 4, tag: "일자리", title: "어르신 사회활동 지원사업", shortDesc: "가까운 복지관에서 건강한 일거리를 찾아드립니다.", org: "노인복지관", eligibility: "만 60세~65세 이상 어르신", period: "연중 모집" }
          ]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex-1 flex flex-col pb-24 bg-slate-50">
          <Header title="맞춤 혜택 찾아보기" userProfile={userProfile} />
          <div className="p-5 space-y-5 overflow-y-auto">
            {/* 배너 */}
            <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-3xl shadow-md">
              <span className="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full">맞춤 복지 리포트</span>
              <h2 className="text-2xl font-extrabold mt-3 mb-1">
                {userProfile.name} 어르신을 위한<br/>추천 복지 혜택입니다
              </h2>
              <p className="text-emerald-100 text-sm mt-1">연령 및 지역 정보에 맞춘 최신 소식이에요.</p>
            </div>

            {/* 정책 리스트 */}
            <div>
              <h3 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i data-lucide="sparkles" className="w-5 h-5 text-emerald-600"></i> 어르신 추천 리스트
              </h3>

              {loading ? (
                <div className="p-10 text-center text-slate-500 font-medium">
                  <div className="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                  어르신께 알맞은 혜택을 검색하고 있습니다...
                </div>
              ) : (
                <div className="space-y-3">
                  {policies.map((p) => (
                    <div 
                      key={p.id} 
                      onClick={() => setSelectedPolicy(p)} 
                      className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-emerald-500 hover:shadow-md transition-all"
                    >
                      {p.tag && (
                        <span className="inline-block bg-emerald-50 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-md mb-2">
                          {p.tag}
                        </span>
                      )}
                      <h4 className="text-lg font-bold text-slate-900 mb-1">{p.title}</h4>
                      <p className="text-sm text-slate-600 mb-3">{p.shortDesc}</p>
                      <div className="text-xs font-bold text-emerald-600 flex items-center gap-1">
                        자세히 내용 보기 <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* AI 대화 유도 */}
            <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl text-center space-y-3">
              <p className="text-base font-bold text-emerald-900">찾으시는 혜택이 없으신가요?</p>
              <button 
                onClick={onOpenChat} 
                className="w-full py-3.5 bg-emerald-600 text-white rounded-xl text-base font-bold shadow-md hover:bg-emerald-700 transition-all flex items-center justify-center gap-2"
              >
                <i data-lucide="message-square" className="w-5 h-5"></i> 복이에게 말로 물어보기
              </button>
            </div>
          </div>

          {/* 정책 상세 모달 */}
          {selectedPolicy && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 space-y-5 max-h-[85vh] overflow-y-auto shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-200">
                <div className="flex justify-between items-start">
                  <h3 className="text-xl font-extrabold text-slate-900 leading-snug">{selectedPolicy.title}</h3>
                  <button onClick={() => setSelectedPolicy(null)} className="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>
                <p className="text-base text-slate-700 leading-relaxed">{selectedPolicy.shortDesc}</p>
                <div className="bg-slate-50 p-4 rounded-xl space-y-2 text-sm text-slate-700 border border-slate-200">
                  <div><span className="font-bold text-slate-900">담당 기관:</span> {selectedPolicy.org || '주민센터'}</div>
                  <div><span className="font-bold text-slate-900">지원 대상:</span> {selectedPolicy.eligibility || '해당 연령 어르신'}</div>
                  <div><span className="font-bold text-slate-900">신청 기간:</span> {selectedPolicy.period || '상시'}</div>
                </div>
                <button 
                  onClick={() => {
                    alert('복이가 대화창에서 안내해 드립니다.');
                    setSelectedPolicy(null);
                    onOpenChat();
                  }}
                  className="w-full py-4 bg-emerald-600 text-white rounded-xl text-base font-bold shadow-md hover:bg-emerald-700 transition-all"
                >
                  이 혜택에 대해 더 알아보기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // AI 대화하기 화면 (음성인식 STT + 음성출력 TTS 완벽 구현)
    const ChatScreen = ({ userProfile }) => {
      const [messages, setMessages] = useState([
        { 
          sender: 'boki', 
          text: `안녕하세요 ${userProfile.name} 어르신! AI 복지 도우미 복이입니다. 정확한 이름을 모르셔도 편하게 말씀해 주시면 알맞은 혜택을 찾아드리겠습니다.` 
        }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [applicationForm, setApplicationForm] = useState(null);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, loading]);

      // 음성 읽기 (TTS)
      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          utterance.rate = 0.9; // 어르신을 위해 약간 천천히
          window.speechSynthesis.speak(utterance);
        }
      };

      // 음성 인식 (STT)
      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬 브라우저를 이용해 주세요.');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = false;

        recognition.onstart = () => {
          setIsListening(true);
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setInput(transcript);
          setIsListening(false);
        };

        recognition.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          setIsListening(false);
          alert('음성을 인식하지 못했습니다. 다시 말씀해 주세요.');
        };

        recognition.onend = () => {
          setIsListening(false);
        };

        recognition.start();
      };

      const handleSend = async () => {
        if (!input.trim() || loading) return;
        const userMsg = input;
        setInput('');
        setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
        setLoading(true);

        try {
          const prompt = `너는 어르신의 복지 혜택을 친절하게 안내하는 전문 AI 도우미 '복이'야. 절대 '멍멍' 소리나 '손주'라는 단어를 사용하지 마.
          어르신이 '바퀴 달린 보행 보조기구'나 모호하게 말씀하시더라도 다정하고 명확하게 어떤 정책(예: 노인 보행보조기 지원, 기초연금 등)인지 설명해줘.
          만약 대화 중 신청서 작성이 필요하다고 생각되면 [APPLY: 정책명] 태그를 답변 끝에 포함해줘.
          어르신 정보: 이름 ${userProfile.name}, 나이 ${userProfile.age}세, 지역 ${userProfile.region}.
          어르신 질문: "${userMsg}"`;

          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });
          const data = await res.json();
          let replyText = data.text || "죄송합니다 어르신, 다시 한번 말씀해 주시겠어요?";
          
          let hasApply = false;
          let policyName = "";
          if (replyText.includes('[APPLY:')) {
            const match = replyText.match(/\[APPLY:\s*(.*?)\]/);
            if (match) {
              policyName = match[1];
              replyText = replyText.replace(/\[APPLY:\s*.*?\]/, '').trim();
              hasApply = true;
            }
          }

          setMessages(prev => [
            ...prev, 
            { 
              sender: 'boki', 
              text: replyText,
              showFormBtn: hasApply,
              policyName: policyName || "노인 복지 지원사업"
            }
          ]);

          if (userProfile.voiceSupport) {
            speakText(replyText);
          }
        } catch (e) {
          setMessages(prev => [...prev, { sender: 'boki', text: "네트워크 연결이 불안정합니다. 잠시 후 다시 말씀해 주세요." }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex-1 flex flex-col h-screen pb-24 bg-slate-50">
          <Header title="복이와 대화하기" userProfile={userProfile} />
          
          {/* 메시지 영역 */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            <div className="text-center my-2">
              <span className="bg-slate-200 text-slate-600 text-xs font-bold px-3 py-1 rounded-full">
                AI 복지 상담실
              </span>
            </div>

            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'} gap-2.5`}>
                {m.sender === 'boki' && <BokiAvatar className="w-10 h-10 flex-shrink-0" />}
                <div className={`p-4 rounded-2xl text-base max-w-[80%] shadow-sm ${m.sender === 'user' ? 'bg-emerald-600 text-white rounded-tr-none font-medium' : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none'}`}>
                  <p className="whitespace-pre-line leading-relaxed">{m.text}</p>
                  
                  {m.sender === 'boki' && (
                    <div className="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                      <button 
                        onClick={() => speakText(m.text)}
                        className="text-xs text-emerald-700 font-bold flex items-center gap-1 hover:underline"
                      >
                        <i data-lucide="volume-2" className="w-4 h-4"></i> 음성으로 듣기
                      </button>
                    </div>
                  )}

                  {m.showFormBtn && (
                    <div className="mt-3 pt-3 border-t border-slate-100">
                      <button 
                        onClick={() => setApplicationForm({ policyName: m.policyName })}
                        className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-bold flex items-center justify-center gap-1.5 shadow-sm hover:bg-emerald-700"
                      >
                        <i data-lucide="file-text" className="w-4 h-4"></i> 간편 신청서 작성
                      </button>
                    </div>
                  )}
                </div>
              </div>
            ))}

            {loading && (
              <div className="flex justify-start gap-2.5">
                <BokiAvatar className="w-10 h-10 flex-shrink-0" />
                <div className="bg-white p-4 rounded-2xl border border-slate-200 text-slate-500 text-sm flex items-center gap-2 shadow-sm">
                  <div className="w-4 h-4 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
                  복이가 알맞은 답변을 생각하고 있습니다...
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* 하단 입력 창 (마이크 기능 강화) */}
          <div className="fixed bottom-16 left-1/2 -translate-x-1/2 w-full max-w-[440px] p-3 bg-white border-t border-slate-200 shadow-lg">
            <div className="flex gap-2 items-center">
              {/* 마이크 버튼 */}
              <button
                type="button"
                onClick={startListening}
                className={`w-12 h-12 rounded-2xl flex items-center justify-center font-bold flex-shrink-0 transition-all ${isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'}`}
                title="음성으로 말하기"
              >
                <i data-lucide={isListening ? "mic-off" : "mic"} className="w-6 h-6"></i>
              </button>

              <input 
                type="text" 
                value={input} 
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                placeholder={isListening ? "듣고 있습니다... 말씀해 주세요" : "복이에게 궁금한 내용을 입력하세요..."} 
                className="flex-1 p-3 border border-slate-300 rounded-2xl text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50"
              />

              <button 
                type="button"
                onClick={handleSend}
                className="w-12 h-12 bg-emerald-600 text-white rounded-2xl flex items-center justify-center font-bold flex-shrink-0 hover:bg-emerald-700 transition-all"
              >
                <i data-lucide="send" className="w-5 h-5"></i>
              </button>
            </div>
            {isListening && (
              <p className="text-center text-xs text-red-500 font-bold mt-1 animate-pulse">음성을 인식하고 있습니다...</p>
            )}
          </div>

          {/* 자동 신청서 모달 */}
          {applicationForm && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-200">
                <div className="flex justify-between items-start">
                  <h3 className="text-xl font-extrabold text-slate-900">간편 신청 양식</h3>
                  <button onClick={() => setApplicationForm(null)} className="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>

                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-sm text-slate-700">
                  <div><span className="text-slate-500 font-bold">신청 항목:</span> <p className="font-bold text-emerald-700 text-base">{applicationForm.policyName}</p></div>
                  <div><span className="text-slate-500 font-bold">신청인:</span> <p className="font-bold">{userProfile.name}</p></div>
                  <div><span className="text-slate-500 font-bold">연령/거주지:</span> <p className="font-bold">만 {userProfile.age}세 / {userProfile.region}</p></div>
                  <div><span className="text-slate-500 font-bold">참고사항:</span> <p className="font-bold">{userProfile.disabled ? '거동 불편 사항 있음' : '특이사항 없음'}</p></div>
                </div>

                <p className="text-xs text-slate-500 text-center leading-relaxed">
                  등록해주신 내 정보를 바탕으로 작성되었습니다.<br/>[제출하기]를 누르시면 관할 주민센터로 연결됩니다.
                </p>

                <button 
                  onClick={() => {
                    alert('신청서 제출이 완료되었습니다! 담당자가 확인 후 연락드립니다.');
                    setApplicationForm(null);
                  }}
                  className="w-full py-4 bg-emerald-600 text-white rounded-xl text-base font-bold shadow-md hover:bg-emerald-700 transition-all"
                >
                  제출하기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 메인 앱
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('browse');
      const [userProfile, setUserProfile] = useState({
        name: '김복순',
        age: '72',
        gender: '여성',
        region: '서울특별시',
        disabled: false,
        voiceSupport: true
      });

      const handleLoginSuccess = (name) => {
        setUserProfile(prev => ({ ...prev, name: name || '어르신' }));
        setIsLoggedIn(true);
      };

      if (!isLoggedIn) {
        return <SplashScreen onLoginSuccess={handleLoginSuccess} />;
      }

      return (
        <div className="flex-1 flex flex-col">
          {activeTab === 'browse' && (
            <BrowseScreen 
              userProfile={userProfile} 
              onOpenChat={() => setActiveTab('chat')} 
            />
          )}
          {activeTab === 'chat' && (
            <ChatScreen userProfile={userProfile} />
          )}
          {activeTab === 'profile' && (
            <ProfileScreen 
              userProfile={userProfile} 
              setUserProfile={setUserProfile} 
              onSave={() => setActiveTab('browse')} 
            />
          )}
          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
