<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복이 - 맞춤 복지 도우미</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Gamja Flower', 'Noto Sans KR', cursive, sans-serif;
      background-color: #f7f6f0;
      color: #2c3e50;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: #FAF8F5;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }
    .hand-font { font-family: 'Gamja Flower', cursive; }
  </style>
</head>
<body>
  <div class="app-container" id="app"></div>

  <script>
    // 상태 관리
    let state = {
      activeTab: 'browse', // 로그인/시작화면 없이 바로 메인 화면 진입
      userProfile: {
        name: '김복순',
        age: '72',
        gender: '여성',
        region: '서울특별시',
        disabled: false,
        voiceSupport: true
      },
      messages: [
        { sender: 'boki', text: "안녕하세요 김복순 어르신! 복지 도우미 복이에요. 무엇이든 편하게 물어보세요!" }
      ],
      selectedPolicy: null
    };

    // 음성 재생 함수
    function speakText(text) {
      if ('speechSynthesis' in window && state.userProfile.voiceSupport) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 화면 렌더링 메인 함수
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      // 헤더
      app.appendChild(createHeader());

      // 메인 콘텐츠
      if (state.activeTab === 'browse') {
        app.appendChild(createBrowseScreen());
      } else if (state.activeTab === 'profile') {
        app.appendChild(createProfileScreen());
      } else if (state.activeTab === 'chat') {
        app.appendChild(createChatScreen());
      }

      // 하단 네비게이션
      app.appendChild(createBottomNav());

      // 모달창 (선택된 정책 있을 때)
      if (state.selectedPolicy) {
        app.appendChild(createModal());
      }

      if (window.lucide) window.lucide.createIcons();
    }

    // 헤더 생성
    function createHeader() {
      const header = document.createElement('div');
      header.className = "flex items-center justify-between px-5 py-4 bg-[#FAF8F5] border-b border-[#EAE6DF] sticky top-0 z-10";
      
      const titleMap = { browse: '찾아보기', profile: '프로필', chat: '대화하기' };
      
      header.innerHTML = `
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-[#F5F2EA] rounded-full flex items-center justify-center border border-[#D0C9B8]">
            <span class="text-xl">🐶</span>
          </div>
          <span class="text-2xl font-bold text-[#3B5E3C] hand-font">복이</span>
        </div>
        <h1 class="text-2xl font-bold text-[#2A3B2C] hand-font">${titleMap[state.activeTab]}</h1>
        <div class="w-10 h-10 rounded-full bg-[#3B5E3C] flex items-center justify-center text-white">
          <i data-lucide="user" class="w-5 h-5"></i>
        </div>
      `;
      return header;
    }

    // 1. 찾아보기 화면
    function createBrowseScreen() {
      const container = document.createElement('div');
      container.className = "p-5 space-y-5 flex-1";

      const policies = [
        { id: 1, tag: "마감 임박", title: "기초연금 정기 지급 안내", shortDesc: "매월 최대 33.4만원의 생활비를 지원받으실 수 있습니다.", org: "보건복지부", eligibility: "만 65세 이상 어르신", period: "상시 신청" },
        { id: 2, tag: "신규 혜택", title: "노인 무료 인공관절 수술비 지원", shortDesc: "수술비 본인 부담금 중 최대 120만원까지 지원해요.", org: "보건소", eligibility: "만 60세 이상 저소득층", period: "예산 소진 시까지" },
        { id: 3, tag: "인기", title: "어르신 일자리 사업 참여", shortDesc: "가까운 복지관에서 가벼운 일거리를 찾아보세요.", org: "노인복지관", eligibility: "만 60세 이상", period: "상시 모집" }
      ];

      let listHtml = policies.map(p => `
        <div onclick="openPolicy(${p.id})" class="bg-white p-4 rounded-2xl border border-[#EAE6DF] shadow-sm cursor-pointer hover:border-[#3B5E3C] transition-all">
          <span class="inline-block bg-[#E5EBE3] text-[#3B5E3C] text-sm px-2.5 py-0.5 rounded-full hand-font font-bold mb-2">${p.tag}</span>
          <h4 class="text-2xl font-bold text-[#2A3B2C] hand-font mb-1">${p.title}</h4>
          <p class="text-lg text-gray-600 hand-font mb-2">${p.shortDesc}</p>
          <div class="text-base text-[#8C6D3B] hand-font flex items-center gap-1">
            <i data-lucide="info" class="w-4 h-4"></i> 자세히 알아보기
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="bg-[#789975] text-white p-6 rounded-3xl shadow-sm">
          <span class="bg-white/20 text-white text-sm px-3 py-1 rounded-full hand-font">맞춤 추천</span>
          <h2 class="text-3xl font-bold hand-font mt-2 mb-1">어르신에게 딱 맞는<br/>혜택을 찾아왔어요!</h2>
          <p class="text-lg hand-font opacity-90">${state.userProfile.name} 어르신의 조건에 맞춰 선별했어요.</p>
        </div>
        <div>
          <h3 class="text-2xl font-bold text-[#2A3B2C] hand-font mb-3">맞춤 혜택 리스트</h3>
          <div class="space-y-3">${listHtml}</div>
        </div>
        <div class="bg-[#EAE6DF] p-5 rounded-3xl text-center space-y-3">
          <p class="text-xl font-bold text-[#2A3B2C] hand-font">더 궁금한 복지 혜택이 있으신가요?</p>
          <button onclick="switchTab('chat')" class="w-full py-3.5 bg-[#8C6D3B] text-white rounded-2xl text-2xl font-bold hand-font flex items-center justify-center gap-2 shadow-md">
            <i data-lucide="message-square" class="w-6 h-6"></i> 도우미 복이에게 물어보기
          </button>
        </div>
      `;
      return container;
    }

    // 2. 프로필 화면
    function createProfileScreen() {
      const container = document.createElement('div');
      container.className = "p-5 space-y-5 flex-1";

      container.innerHTML = `
        <div class="bg-[#EAE6DF] p-4 rounded-2xl border border-[#D5CFC0] text-center">
          <p class="text-xl text-[#2A3B2C] hand-font">"안녕하세요! 저는 복지 도우미 복이라고 해요. 아래 어르신의 정보를 확인해 주세요."</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-gray-700 font-bold mb-1 hand-font text-xl">성함</label>
            <input type="text" id="prof-name" value="${state.userProfile.name}" class="w-full p-3 border border-gray-300 rounded-2xl text-xl hand-font bg-white">
          </div>

          <div class="flex gap-4">
            <div class="flex-1">
              <label class="block text-gray-700 font-bold mb-1 hand-font text-xl">나이</label>
              <input type="number" id="prof-age" value="${state.userProfile.age}" class="w-full p-3 border border-gray-300 rounded-2xl text-xl hand-font bg-white">
            </div>
            <div class="flex-1">
              <label class="block text-gray-700 font-bold mb-1 hand-font text-xl">지역</label>
              <input type="text" id="prof-region" value="${state.userProfile.region}" class="w-full p-3 border border-gray-300 rounded-2xl text-xl hand-font bg-white">
            </div>
          </div>

          <div class="bg-[#EBF3ED] p-4 rounded-2xl flex items-center justify-between border border-[#C6DCCE]">
            <div>
              <p class="text-xl font-bold text-[#2A3B2C] hand-font">음성 지원 모드</p>
              <p class="text-base text-gray-600 hand-font">복이가 글씨를 소리로 읽어드려요</p>
            </div>
            <button onclick="toggleVoice()" class="px-4 py-2 rounded-xl text-lg hand-font font-bold ${state.userProfile.voiceSupport ? 'bg-[#3B5E3C] text-white' : 'bg-gray-300'}">
              ${state.userProfile.voiceSupport ? '켜짐' : '꺼짐'}
            </button>
          </div>

          <button onclick="saveProfile()" class="w-full py-4 bg-[#3B5E3C] text-white rounded-2xl text-2xl font-bold hand-font shadow-md mt-4">
            저장하고 혜택 보기
          </button>
        </div>
      `;
      return container;
    }

    // 3. 대화하기 화면
    function createChatScreen() {
      const container = document.createElement('div');
      container.className = "p-4 space-y-4 flex-1 flex flex-col justify-between";

      let chatList = state.messages.map(m => `
        <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'} gap-2">
          ${m.sender === 'boki' ? '<div class="w-8 h-8 rounded-full bg-[#EAE6DF] flex items-center justify-center">🐶</div>' : ''}
          <div class="p-4 rounded-3xl text-xl hand-font max-w-[80%] ${m.sender === 'user' ? 'bg-[#789975] text-white' : 'bg-white text-gray-800 border border-[#EAE6DF]'}">
            ${m.text}
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="space-y-3 flex-1 overflow-y-auto">
          <div class="text-center my-2"><span class="bg-[#EAE6DF] text-gray-600 text-lg px-4 py-1 rounded-full hand-font">오늘의 대화</span></div>
          ${chatList}
        </div>

        <div class="flex gap-2 items-center bg-white p-2 rounded-full border border-[#D5CFC0] shadow-sm mt-2">
          <input type="text" id="chat-input" placeholder="복이에게 물어보세요..." class="flex-1 px-4 text-xl hand-font focus:outline-none bg-transparent" onkeydown="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()" class="w-12 h-12 bg-[#3B5E3C] text-white rounded-full flex items-center justify-center font-bold">
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </div>
      `;
      return container;
    }

    // 하단 네비게이션
    function createBottomNav() {
      const nav = document.createElement('div');
      nav.className = "fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-[#FAF8F5] border-t border-[#EAE6DF] flex justify-around py-3 px-4 z-20";
      
      const tabs = [
        { id: 'profile', label: '프로필', icon: 'user' },
        { id: 'browse', label: '찾아보기', icon: 'search' },
        { id: 'chat', label: '대화하기', icon: 'message-square' }
      ];

      nav.innerHTML = tabs.map(t => `
        <button onclick="switchTab('${t.id}')" class="flex flex-col items-center gap-1 ${state.activeTab === t.id ? 'text-[#3B5E3C]' : 'text-gray-400'}">
          <i data-lucide="${t.icon}" class="w-6 h-6"></i>
          <span class="text-lg hand-font font-bold">${t.label}</span>
        </button>
      `).join('');

      return nav;
    }

    // 상세보기 모달
    function createModal() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";
      const p = state.selectedPolicy;

      modal.innerHTML = `
        <div class="bg-[#FAF8F5] w-full max-w-[390px] rounded-3xl p-6 space-y-4">
          <div class="flex justify-between items-start">
            <h3 class="text-3xl font-bold text-[#2A3B2C] hand-font">${p.title}</h3>
            <button onclick="closeModal()" class="text-gray-400 text-2xl font-bold">✕</button>
          </div>
          <p class="text-xl text-gray-700 hand-font">${p.shortDesc}</p>
          <hr class="border-[#EAE6DF]"/>
          <div class="space-y-2 hand-font text-xl">
            <p><b>주관 기관:</b> ${p.org}</p>
            <p><b>자격 요건:</b> ${p.eligibility}</p>
            <p><b>신청 기간:</b> ${p.period}</p>
          </div>
          <button onclick="alert('신청이 완료되었습니다.'); closeModal();" class="w-full py-3.5 bg-[#3B5E3C] text-white rounded-2xl text-2xl font-bold hand-font shadow-md">
            바로 신청하기
          </button>
        </div>
      `;
      return modal;
    }

    // Event Handlers
    function switchTab(tab) {
      state.activeTab = tab;
      render();
    }

    function openPolicy(id) {
      const policies = [
        { id: 1, tag: "마감 임박", title: "기초연금 정기 지급 안내", shortDesc: "매월 최대 33.4만원의 생활비를 지원받으실 수 있습니다.", org: "보건복지부", eligibility: "만 65세 이상 어르신", period: "상시 신청" },
        { id: 2, tag: "신규 혜택", title: "노인 무료 인공관절 수술비 지원", shortDesc: "수술비 본인 부담금 중 최대 120만원까지 지원해요.", org: "보건소", eligibility: "만 60세 이상 저소득층", period: "예산 소진 시까지" },
        { id: 3, tag: "인기", title: "어르신 일자리 사업 참여", shortDesc: "가까운 복지관에서 가벼운 일거리를 찾아보세요.", org: "노인복지관", eligibility: "만 60세 이상", period: "상시 모집" }
      ];
      state.selectedPolicy = policies.find(p => p.id === id);
      render();
    }

    function closeModal() {
      state.selectedPolicy = null;
      render();
    }

    function toggleVoice() {
      state.userProfile.voiceSupport = !state.userProfile.voiceSupport;
      if (state.userProfile.voiceSupport) speakText("음성 지원이 켜졌습니다.");
      render();
    }

    function saveProfile() {
      const name = document.getElementById('prof-name').value;
      const age = document.getElementById('prof-age').value;
      const region = document.getElementById('prof-region').value;

      state.userProfile.name = name;
      state.userProfile.age = age;
      state.userProfile.region = region;

      speakText("프로필 정보가 저장되었습니다.");
      switchTab('browse');
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const val = input.value.trim();
      if (!val) return;

      state.messages.push({ sender: 'user', text: val });
      render();

      setTimeout(() => {
        const reply = `${state.userProfile.name} 어르신, 문의하신 "${val}"에 관해 복지 도우미 복이가 확인했어요! 가까운 주민센터에 방문하시면 친절히 안내받으실 수 있습니다.`;
        state.messages.push({ sender: 'boki', text: reply });
        speakText(reply);
        render();
      }, 600);
    }

    // 최초 렌더링 실행
    render();
  </script>
</body>
</html>
