<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복이 - 손주같은 복지 도우미</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Gamja Flower (손글씨 느낌) & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Gamja Flower', 'Noto Sans KR', cursive, sans-serif;
      background-color: #f7f6f0;
      color: #2c3e50;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: #FAF8F5;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }
    .hand-font {
      font-family: 'Gamja Flower', cursive;
    }
    .noto-font {
      font-family: 'Noto Sans KR', sans-serif;
    }
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root" class="app-container"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 복이 강아지 프로필 SVG 컴포넌트
    const BokiAvatar = ({ className = "w-12 h-12" }) => (
      <div className={`bg-[#EAE5D9] rounded-full flex items-center justify-center p-1 border border-[#D5CFC0] overflow-hidden ${className}`}>
        <svg viewBox="0 0 100 100" className="w-full h-full">
          <ellipse cx="50" cy="55" rx="30" ry="25" fill="#FFFDF9" stroke="#333" strokeWidth="3"/>
          <ellipse cx="50" cy="50" rx="35" ry="30" fill="#FFFDF9" stroke="#333" strokeWidth="3"/>
          <path d="M 20 35 C 10 35, 10 60, 25 60 Z" fill="#EAE5D9" stroke="#333" strokeWidth="3"/>
          <path d="M 80 35 C 90 35, 90 60, 75 60 Z" fill="#EAE5D9" stroke="#333" strokeWidth="3"/>
          <circle cx="38" cy="45" r="4" fill="#333"/>
          <circle cx="62" cy="45" r="4" fill="#333"/>
          <ellipse cx="50" cy="53" rx="5" ry="4" fill="#333"/>
          <path d="M 45 58 Q 50 63 55 58" fill="none" stroke="#333" strokeWidth="3" strokeLinecap="round"/>
        </svg>
      </div>
    );

    // 공통 헤더
    const Header = ({ title, activeTab }) => (
      <div className="flex items-center justify-between px-5 py-4 bg-[#FAF8F5] border-b border-[#EAE6DF] sticky top-0 z-10">
        <div className="flex items-center gap-2">
          <BokiAvatar className="w-10 h-10" />
          <span className="text-2xl font-bold text-[#3B5E3C] hand-font">복이</span>
        </div>
        <h1 className="text-2xl font-bold text-[#2A3B2C] hand-font">{title}</h1>
        <div className="w-10 h-10 rounded-full bg-[#3B5E3C] flex items-center justify-center text-white">
          <i data-lucide="user" className="w-5 h-5"></i>
        </div>
      </div>
    );

    // 하단 네비게이션
    const BottomNav = ({ activeTab, setActiveTab }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab]);

      return (
        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-[#EAE6DF] flex justify-around py-2 px-4 z-20">
          <button 
            onClick={() => setActiveTab('profile')} 
            className={`flex flex-col items-center gap-1 ${activeTab === 'profile' ? 'text-[#3B5E3C]' : 'text-gray-400'}`}
          >
            <i data-lucide="user" className="w-6 h-6"></i>
            <span className="text-base hand-font font-bold">프로필</span>
          </button>
          <button 
            onClick={() => setActiveTab('browse')} 
            className={`flex flex-col items-center gap-1 ${activeTab === 'browse' ? 'text-[#3B5E3C]' : 'text-gray-400'}`}
          >
            <i data-lucide="search" className="w-6 h-6"></i>
            <span className="text-base hand-font font-bold">찾아보기</span>
          </button>
          <button 
            onClick={() => setActiveTab('chat')} 
            className={`flex flex-col items-center gap-1 ${activeTab === 'chat' ? 'text-[#3B5E3C]' : 'text-gray-400'}`}
          >
            <i data-lucide="message-square" className="w-6 h-6"></i>
            <span className="text-base hand-font font-bold">대화하기</span>
          </button>
        </div>
      );
    };

    // 1. Splash Screen
    const SplashScreen = ({ onStart }) => {
      return (
        <div className="flex-1 flex flex-col items-center justify-between p-6 bg-[#FAF8F5] text-center">
          <div className="w-full flex-1 flex flex-col items-center justify-center">
            <div className="relative mb-6">
              <div className="w-48 h-48 bg-[#EAE5D9] rounded-3xl flex items-center justify-center border-2 border-[#D5CFC0] p-4">
                <BokiAvatar className="w-36 h-36 border-none bg-transparent" />
              </div>
              <div className="absolute -top-3 -right-3 bg-white px-4 py-2 rounded-full border border-[#D5CFC0] shadow-sm">
                <span className="text-xl font-bold text-[#3B5E3C] hand-font">멍멍!</span>
              </div>
            </div>
            
            <h2 className="text-2xl font-bold text-[#2A3B2C] hand-font mb-2">안녕하세요!</h2>
            <h1 className="text-3xl font-bold text-[#3B5E3C] hand-font mb-4">손주같은 복이가<br/>도와드릴게요</h1>
            <p className="text-lg text-gray-600 hand-font">
              어려운 휴대폰 사용,<br/>복이와 함께라면 쉽고 즐거워요.
            </p>
          </div>

          <div className="w-full space-y-3 mb-12">
            <button 
              onClick={onStart}
              className="w-full py-4 bg-[#3B5E3C] text-white rounded-2xl text-2xl font-bold hand-font flex items-center justify-center gap-2 shadow-md hover:bg-[#2F4B30] transition-colors"
            >
              시작하기 <i data-lucide="arrow-right" className="w-6 h-6"></i>
            </button>
            <button 
              onClick={onStart}
              className="w-full py-4 bg-[#EAE6DF] text-[#4A463D] rounded-2xl text-xl font-bold hand-font hover:bg-[#DDD8CE] transition-colors"
            >
              이미 계정이 있어요 (로그인)
            </button>
            
            <div className="pt-4 flex items-center justify-center gap-2">
              <div className="bg-[#2C2C2C] text-white px-4 py-2 rounded-full text-base hand-font shadow-sm flex items-center gap-2">
                <span>"복이야 도와줘" 라고 말씀해보세요</span>
              </div>
              <div className="w-12 h-12 bg-white rounded-full border-2 border-[#3B5E3C] flex items-center justify-center text-[#3B5E3C]">
                <i data-lucide="mic" className="w-6 h-6"></i>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // 2. Profile Screen
    const ProfileScreen = ({ userProfile, setUserProfile, onSave }) => {
      const handleChange = (field, value) => {
        setUserProfile(prev => ({ ...prev, [field]: value }));
      };

      const speakText = (text) => {
        if (userProfile.voiceMode && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          window.speechSynthesis.speak(utterance);
        }
      };

      return (
        <div className="flex-1 flex flex-col pb-24">
          <Header title="프로필" />
          <div className="p-5 space-y-6 overflow-y-auto">
            {/* 복이 대화 상자 */}
            <div className="flex flex-col items-center">
              <BokiAvatar className="w-24 h-24 mb-2" />
              <div className="bg-[#E5EBE3] p-4 rounded-2xl border border-[#C2D1BF] text-center w-full relative">
                <p className="text-xl text-[#2A3B2C] hand-font">
                  "안녕하세요! 저는 복이라고 해요.<br/>어르신께 꼭 맞는 소식을 찾아드릴게요.<br/>정보를 알려주시겠어요?"
                </p>
              </div>
            </div>

            {/* 입력 폼 */}
            <div className="space-y-4 font-hand text-xl">
              <div>
                <label className="block text-gray-700 font-bold mb-1 hand-font text-xl">성함이 어떻게 되시나요?</label>
                <input 
                  type="text" 
                  value={userProfile.name}
                  onChange={(e) => handleChange('name', e.target.value)}
                  placeholder="이름을 입력해주세요"
                  className="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:border-[#3B5E3C] text-xl hand-font bg-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-gray-700 font-bold mb-1 hand-font text-xl">성별</label>
                  <div className="flex gap-2">
                    <button 
                      type="button"
                      onClick={() => handleChange('gender', '남성')}
                      className={`flex-1 py-3 rounded-xl border text-xl hand-font ${userProfile.gender === '남성' ? 'bg-[#3B5E3C] text-white border-[#3B5E3C]' : 'bg-white text-gray-700 border-gray-300'}`}
                    >
                      남성
                    </button>
                    <button 
                      type="button"
                      onClick={() => handleChange('gender', '여성')}
                      className={`flex-1 py-3 rounded-xl border text-xl hand-font ${userProfile.gender === '여성' ? 'bg-[#3B5E3C] text-white border-[#3B5E3C]' : 'bg-white text-gray-700 border-gray-300'}`}
                    >
                      여성
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-gray-700 font-bold mb-1 hand-font text-xl">나이</label>
                  <input 
                    type="number" 
                    value={userProfile.age}
                    onChange={(e) => handleChange('age', e.target.value)}
                    placeholder="예: 72"
                    className="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-[#3B5E3C] text-xl hand-font bg-white"
                  />
                </div>
              </div>

              <div>
                <label className="block text-gray-700 font-bold mb-1 hand-font text-xl">어디에 살고 계신가요?</label>
                <select 
                  value={userProfile.region}
                  onChange={(e) => handleChange('region', e.target.value)}
                  className="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:border-[#3B5E3C] text-xl hand-font bg-white"
                >
                  <option value="서울특별시">서울특별시</option>
                  <option value="경기도">경기도</option>
                  <option value="부산광역시">부산광역시</option>
                  <option value="대구광역시">대구광역시</option>
                  <option value="인천광역시">인천광역시</option>
                  <option value="광주광역시">광주광역시</option>
                  <option value="대전광역시">대전광역시</option>
                  <option value="울산광역시">울산광역시</option>
                  <option value="강원도">강원도</option>
                  <option value="충청북도">충청북도</option>
                  <option value="충청남도">충청남도</option>
                  <option value="전라북도">전라북도</option>
                  <option value="전라남도">전라남도</option>
                  <option value="경상북도">경상북도</option>
                  <option value="경상남도">경상남도</option>
                  <option value="제주특별자치도">제주특별자치도</option>
                </select>
              </div>

              <div>
                <label className="block text-gray-700 font-bold mb-1 hand-font text-xl">도움이 필요한 신체적 어려움이 있으신가요?</label>
                <div className="flex gap-2">
                  <button 
                    type="button"
                    onClick={() => handleChange('disabled', false)}
                    className={`flex-1 py-3 rounded-xl border text-xl hand-font ${!userProfile.disabled ? 'bg-[#3B5E3C] text-white border-[#3B5E3C]' : 'bg-white text-gray-700 border-gray-300'}`}
                  >
                    없음
                  </button>
                  <button 
                    type="button"
                    onClick={() => handleChange('disabled', true)}
                    className={`flex-1 py-3 rounded-xl border text-xl hand-font ${userProfile.disabled ? 'bg-[#3B5E3C] text-white border-[#3B5E3C]' : 'bg-white text-gray-700 border-gray-300'}`}
                  >
                    있음
                  </button>
                </div>
              </div>

              {/* 음성 지원 모드 스위치 */}
              <div className="bg-[#EBF2FA] p-4 rounded-2xl border border-[#D0E2F5] flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <i data-lucide="volume-2" className="w-8 h-8 text-[#2B6CB0]"></i>
                  <div>
                    <h3 className="text-xl font-bold text-[#2B6CB0] hand-font">음성 지원 모드</h3>
                    <p className="text-sm text-gray-600 noto-font">복이가 글씨를 읽어드려요</p>
                  </div>
                </div>
                <label className="relative inline-flex items-center cursor-pointer">
                  <input 
                    type="checkbox" 
                    checked={userProfile.voiceMode} 
                    onChange={(e) => {
                      handleChange('voiceMode', e.target.checked);
                      if (e.target.checked) speakText("음성 지원 모드가 켜졌어요!");
                    }} 
                    className="sr-only peer"
                  />
                  <div className="w-14 h-7 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-[#3B5E3C]"></div>
                </label>
              </div>

              <button 
                onClick={onSave}
                className="w-full py-4 bg-[#3B5E3C] text-white rounded-2xl text-2xl font-bold hand-font flex items-center justify-center gap-2 shadow-md hover:bg-[#2F4B30] transition-colors mt-6"
              >
                저장하고 추천 받기 <i data-lucide="arrow-right" className="w-6 h-6"></i>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // 3. Policy Detail Modal
    const PolicyDetailModal = ({ policy, onClose }) => {
      const [applied, setApplied] = useState(false);

      if (!policy) return null;

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
          <div className="bg-white w-full max-w-[430px] rounded-t-3xl p-6 max-h-[85vh] overflow-y-auto animate-slide-up">
            <div className="flex justify-between items-start mb-4">
              <span className="px-3 py-1 bg-[#E8F0E6] text-[#3B5E3C] rounded-full text-lg font-bold hand-font">
                {policy.tag || "맞춤 혜택"}
              </span>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-gray-600">
                <i data-lucide="x" className="w-7 h-7"></i>
              </button>
            </div>

            <h2 className="text-2xl font-bold text-[#2A3B2C] hand-font mb-2">{policy.title}</h2>
            <p className="text-lg text-gray-600 hand-font mb-6">{policy.summary}</p>

            <div className="space-y-4 border-t border-b border-gray-100 py-4 mb-6 text-lg hand-font">
              <div>
                <span className="text-gray-400 block text-base">주관 기관</span>
                <span className="text-gray-800 font-bold">{policy.organizer || "보건복지부 / 지자체"}</span>
              </div>
              <div>
                <span className="text-gray-400 block text-base">자격 요건</span>
                <span className="text-gray-800 font-bold">{policy.qualification || "만 65세 이상 어르신"}</span>
              </div>
              <div>
                <span className="text-gray-400 block text-base">신청 기간</span>
                <span className="text-gray-800 font-bold">{policy.period || "상시 접수"}</span>
              </div>
              <div>
                <span className="text-gray-400 block text-base">상세 내용</span>
                <p className="text-gray-700 noto-font text-sm leading-relaxed mt-1">
                  {policy.detail || "관련 법령 및 지침에 따라 어르신의 건강하고 안락한 노후 생활을 지원하기 위한 필수 제도입니다."}
                </p>
              </div>
            </div>

            {applied ? (
              <div className="bg-[#E8F0E6] text-[#3B5E3C] p-4 rounded-2xl text-center hand-font text-xl font-bold">
                🎉 신청이 정상적으로 완료되었습니다!
              </div>
            ) : (
              <button 
                onClick={() => setApplied(true)}
                className="w-full py-4 bg-[#3B5E3C] text-white rounded-2xl text-2xl font-bold hand-font flex items-center justify-center gap-2 shadow-md hover:bg-[#2F4B30]"
              >
                바로 신청하기
              </button>
            )}
          </div>
        </div>
      );
    };

    // 4. Browse Screen
    const BrowseScreen = ({ userProfile, onOpenChat }) => {
      const [aiRecommendations, setAiRecommendations] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedPolicy, setSelectedPolicy] = useState(null);

      // AI 추천 불러오기
      useEffect(() => {
        const fetchRecommendations = async () => {
          setLoading(true);
          try {
            const prompt = `사용자 정보: 이름 ${userProfile.name}, 나이 ${userProfile.age}세, 성별 ${userProfile.gender}, 거주지 ${userProfile.region}, 신체어려움 여부 ${userProfile.disabled ? '있음' : '없음'}. 
            이 어르신에게 딱 맞는 한국 복지 정책 3가지를 추천해줘. 
            응답 형식은 반드시 JSON 배열 형태 [
              {"title": "정책명", "summary": "한줄설명", "tag": "마감임박/신규혜택 등", "period": "기간", "organizer": "기관", "qualification": "요건", "detail": "상세설명"}
            ] 로만 보내줘. 다른 설명은 제외해.`;

            const res = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt })
            });

            const data = await res.json();
            if (data.text) {
              const cleanedText = data.text.replace(/```json/g, '').replace(/```/g, '').trim();
              const parsed = JSON.parse(cleanedText);
              setAiRecommendations(parsed);
            }
          } catch (err) {
            console.error("AI 추천 오류:", err);
            // 기본 예시 데이터
            setAiRecommendations([
              {
                title: "기초연금 정기 지급 안내",
                summary: "매월 최대 32만원의 생활비를 지원받으실 수 있습니다.",
                tag: "마감 임박",
                period: "12월 31일까지",
                organizer: "보건복지부",
                qualification: "만 65세 이상 소득인정액 기준 하위 70%",
                detail: "어르신의 안정적인 소득기반 제공을 위해 매월 정기적으로 지급되는 연금제도입니다."
              },
              {
                title: "노인 무료 인공관절 수술비",
                summary: "수술비 본인 부담금 중 최대 120만원까지 지원해요.",
                tag: "신규 혜택",
                period: "예산 소진 시까지",
                organizer: "어르신 거주지 인근 보건소",
                qualification: "만 60세 이상 저소득층 어르신",
                detail: "무릎관절증으로 인하여 고통받는 어르신들에게 수술비를 지원하여 건강한 노후를 보장합니다."
              },
              {
                title: "어르신 일자리 사업 참여",
                summary: "가까운 복지관에서 가벼운 일거리를 찾아보세요.",
                tag: "상시 모집",
                period: "연중 상시",
                organizer: "한국노인인력개발원",
                qualification: "만 60~65세 이상 사업별 기준 적용",
                detail: "어르신이 활기차고 건강한 노후생활을 영위할 수 있도록 다양한 사회활동을 지원합니다."
              }
            ]);
          } finally {
            setLoading(false);
          }
        };

        fetchRecommendations();
      }, [userProfile]);

      return (
        <div className="flex-1 flex flex-col pb-24">
          <Header title="찾아보기" />
          <div className="p-5 space-y-6 overflow-y-auto">
            {/* 상단 복이 인공지능 추천 카드 */}
            <div className="bg-[#789975] text-white p-6 rounded-3xl relative overflow-hidden shadow-sm">
              <div className="inline-flex items-center gap-1.5 bg-white/20 px-3 py-1 rounded-full text-sm font-bold hand-font mb-3">
                <i data-lucide="bot" className="w-4 h-4"></i> 복이 인공지능 추천
              </div>
              <h2 className="text-3xl font-bold hand-font leading-tight mb-2">
                어르신에게 딱 맞는<br/>혜택을 찾아왔어요!
              </h2>
              <p className="text-lg opacity-90 hand-font">
                {userProfile.name} 어르신의 건강 상태와 거주 지역을 고려해 선별한 소식이에요.
              </p>
              <div className="absolute -bottom-2 -right-2 bg-white/90 p-2 rounded-tl-3xl shadow-inner">
                <BokiAvatar className="w-16 h-16" />
              </div>
            </div>

            {/* 카테고리 버튼 */}
            <div className="grid grid-cols-2 gap-3">
              <button className="bg-[#DCE7F5] p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-[#CBDDF2]">
                <div className="w-12 h-12 bg-[#8BB4E7] rounded-full flex items-center justify-center text-white">
                  <i data-lucide="first-aid-kit" className="w-6 h-6"></i>
                </div>
                <span className="text-xl font-bold text-[#2B4C7E] hand-font">의료 지원</span>
              </button>
              <button className="bg-[#FCE8D5] p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-[#F9DCC1]">
                <div className="w-12 h-12 bg-[#E79F5D] rounded-full flex items-center justify-center text-white">
                  <i data-lucide="wallet" className="w-6 h-6"></i>
                </div>
                <span className="text-xl font-bold text-[#7E4A1D] hand-font">생활 지원금</span>
              </button>
            </div>

            {/* 맞춤 혜택 리스트 */}
            <div>
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-2xl font-bold text-[#2A3B2C] hand-font">맞춤 혜택 리스트</h3>
                <span className="text-lg text-gray-400 hand-font border-b border-gray-400 cursor-pointer">전체보기</span>
              </div>

              {loading ? (
                <div className="py-12 text-center text-xl hand-font text-gray-500">
                  복이가 어르신을 위한 혜택을 찾고 있어요... 🐶
                </div>
              ) : (
                <div className="space-y-4">
                  {aiRecommendations.map((item, idx) => (
                    <div 
                      key={idx} 
                      onClick={() => setSelectedPolicy(item)}
                      className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm hover:border-[#3B5E3C] transition-all cursor-pointer relative"
                    >
                      {item.tag && (
                        <span className={`inline-block px-3 py-0.5 rounded-full text-base font-bold hand-font mb-2 ${
                          item.tag.includes('마감') ? 'bg-[#DCE7F5] text-[#2B4C7E]' : 'bg-[#E5EBE3] text-[#3B5E3C]'
                        }`}>
                          {item.tag}
                        </span>
                      )}
                      <h4 className="text-2xl font-bold text-[#2A3B2C] hand-font mb-1">{item.title}</h4>
                      <p className="text-lg text-gray-600 hand-font mb-3 leading-snug">{item.summary}</p>
                      
                      <div className="flex items-center gap-1 text-gray-500 text-base hand-font">
                        <i data-lucide="calendar" className="w-4 h-4 text-[#3B5E3C]"></i>
                        <span>신청 기간: {item.period || "상시"}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* 하단 질문 유도 배너 */}
            <div className="bg-[#EAE5D9] p-6 rounded-3xl text-center space-y-3 relative">
              <div className="w-12 h-12 bg-[#8C6D3B] text-white rounded-full mx-auto flex items-center justify-center">
                <i data-lucide="help-circle" className="w-6 h-6"></i>
              </div>
              <h4 className="text-2xl font-bold text-[#4A3B2C] hand-font">더 많은 혜택이 있을까요?</h4>
              <p className="text-lg text-gray-700 hand-font">
                복이에게 "내가 받을 수 있는 돈 더 있어?"라고 물어보세요.
              </p>
              <button 
                onClick={onOpenChat}
                className="w-full py-3 bg-[#8C6D3B] text-white rounded-2xl text-xl font-bold hand-font flex items-center justify-center gap-2 shadow-sm"
              >
                <i data-lucide="mic" className="w-5 h-5"></i> 복이에게 물어보기
              </button>
            </div>
          </div>

          <PolicyDetailModal policy={selectedPolicy} onClose={() => setSelectedPolicy(null)} />
        </div>
      );
    };

    // 5. Chat Screen
    const ChatScreen = ({ userProfile }) => {
      const [messages, setMessages] = useState([
        {
          sender: 'boki',
          text: `멍멍! 안녕하세요 ${userProfile.name} 어르신! 손주 복이에요 🐾 무엇이 궁금하신가요? 편하게 말씀해주세요!`,
          time: '오후 2:15'
        }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      // 음성 읽어주기 기능
      const speak = (text) => {
        if (userProfile.voiceMode && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          // 카드 형태 등 특수문자 제거
          const cleanText = text.replace(/[*#]/g, '');
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'ko-KR';
          window.speechSynthesis.speak(utterance);
        }
      };

      const handleSend = async () => {
        if (!input.trim() || loading) return;

        const userMsg = input;
        const currentTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

        setMessages(prev => [...prev, { sender: 'user', text: userMsg, time: currentTime }]);
        setInput('');
        setLoading(true);

        try {
          const prompt = `
            너는 '복이'라는 이름의 귀여운 강아지 캐릭터이자 어르신의 친손주 같은 복지 지원 AI 어시스턴트야.
            말투는 "멍멍! 어르신~", "~했어요!", "~해드릴게요!"처럼 사근사근하고 다정하게 말해야 해.
            어르신이 '아 그 왜 바퀴 달리고 막 가고 하는 거 있잖아'처럼 모호하게 말해도, 
            문맥을 잘 파악해서 (예: 전동휠체어, 실버카, 기초연금, 노인일자리 등) 정확한 정책과 지원 혜택을 사근사근 친절하게 설명해줘.
            
            사용자 프로필: 이름 ${userProfile.name}, 나이 ${userProfile.age}, 거주지 ${userProfile.region}.
            어르신 질문: "${userMsg}"

            만약 신청 가능한 정책이 있다면, 답변 마지막 줄에 반드시 아래와 같은 포맷으로 서류 작성 추천 카드용 JSON 데이터를 포함해줘.
            [CARD_DATA: {"title": "보행 보조기구 지원사업", "benefit": "정부 지원금 최대 90%"}]
          `;

          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });

          const data = await res.json();
          let botReply = data.text || "멍멍! 죄송해요 어르신, 복이가 잠시 딴생각을 했나봐요. 다시 말씀해주시겠어요?";
          
          let cardInfo = null;
          if (botReply.includes('[CARD_DATA:')) {
            const parts = botReply.split('[CARD_DATA:');
            botReply = parts[0].trim();
            try {
              const jsonStr = parts[1].replace(']', '').trim();
              cardInfo = JSON.parse(jsonStr);
            } catch (e) {
              console.error("Card parsing error", e);
            }
          }

          setMessages(prev => [
            ...prev, 
            { sender: 'boki', text: botReply, card: cardInfo, time: currentTime }
          ]);

          speak(botReply);

        } catch (err) {
          console.error(err);
          setMessages(prev => [
            ...prev, 
            { sender: 'boki', text: "멍멍! 죄송해요 어르신, 인터넷 연결이 잠시 불안정해요 🐾", time: currentTime }
          ]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex-1 flex flex-col h-screen pb-24">
          <Header title="Chat" />
          
          {/* 날짜 표시 */}
          <div className="text-center my-3">
            <span className="bg-[#EAE6DF] text-[#5A564D] px-4 py-1 rounded-full text-base hand-font">
              오늘, {new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' })}
            </span>
          </div>

          {/* 대화 영역 */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
            {messages.map((msg, idx) => (
              <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'} items-end gap-2`}>
                {msg.sender === 'boki' && <BokiAvatar className="w-10 h-10 self-start" />}
                
                <div className={`max-w-[75%] ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`p-4 rounded-3xl text-xl hand-font leading-relaxed shadow-sm ${
                    msg.sender === 'user' 
                      ? 'bg-[#789975] text-white rounded-br-none' 
                      : 'bg-white text-[#2A3B2C] border border-gray-100 rounded-bl-none'
                  }`}>
                    {msg.text}

                    {/* 신청 서류 카드 (필요시) */}
                    {msg.card && (
                      <div className="mt-3 bg-[#FAF8F5] p-3 rounded-2xl border border-[#EAE6DF] text-center space-y-2">
                        <div className="flex items-center justify-center gap-2 text-[#8C6D3B] font-bold">
                          <i data-lucide="file-text" className="w-5 h-5"></i>
                          <span>{msg.card.title}</span>
                        </div>
                        <p className="text-sm text-gray-600 noto-font">{msg.card.benefit}</p>
                        <button 
                          onClick={() => alert('신청 서류 작성이 시작되었습니다!')}
                          className="w-full py-2 bg-[#8C6D3B] text-white rounded-xl text-lg font-bold hand-font flex items-center justify-center gap-1 shadow-sm"
                        >
                          <BokiAvatar className="w-6 h-6 border-none bg-transparent" />
                          <span>신청 서류 작성하기</span>
                        </button>
                      </div>
                    )}
                  </div>
                  <span className="text-xs text-gray-400 mt-1 block hand-font px-1">{msg.time}</span>
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start items-center gap-2">
                <BokiAvatar className="w-10 h-10" />
                <div className="bg-white p-3 rounded-2xl text-lg hand-font text-gray-400">
                  복이가 생각하고 있어요... 🐾
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* 입력 창 */}
          <div className="fixed bottom-16 left-1/2 -translate-x-1/2 w-full max-w-[430px] p-3 bg-[#FAF8F5] border-t border-[#EAE6DF]">
            <div className="flex items-center gap-2 bg-white rounded-full border border-gray-300 p-2 pl-4 shadow-sm">
              <input 
                type="text" 
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                placeholder="복이에게 말해보세요..."
                className="flex-1 text-xl hand-font focus:outline-none bg-transparent"
              />
              <button 
                onClick={handleSend}
                disabled={loading}
                className="w-12 h-12 bg-[#3B5E3C] text-white rounded-full flex items-center justify-center font-bold hand-font text-lg shadow-md hover:bg-[#2F4B30] transition-colors"
              >
                전송
              </button>
            </div>
          </div>
        </div>
      );
    };

    // 메인 앱 컴포넌트
    const App = () => {
      const [started, setStarted] = useState(false);
      const [activeTab, setActiveTab] = useState('browse');
      const [userProfile, setUserProfile] = useState({
        name: '김복순',
        gender: '여성',
        age: '72',
        region: '서울특별시',
        disabled: false,
        voiceMode: true
      });

      if (!started) {
        return <SplashScreen onStart={() => setStarted(true)} />;
      }

      return (
        <div className="flex-1 flex flex-col relative">
          {activeTab === 'profile' && (
            <ProfileScreen 
              userProfile={userProfile} 
              setUserProfile={setUserProfile} 
              onSave={() => setActiveTab('browse')}
            />
          )}
          {activeTab === 'browse' && (
            <BrowseScreen 
              userProfile={userProfile} 
              onOpenChat={() => setActiveTab('chat')}
            />
          )}
          {activeTab === 'chat' && (
            <ChatScreen userProfile={userProfile} />
          )}

          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
